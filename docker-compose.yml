version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: tijanes_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend
      - ./frontend/dist:/var/www/frontend
    depends_on:
      - php
      - frontend
    networks:
      - tijanes_net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tijanes_php
    volumes:
      - ./backend:/var/www/backend
    environment:
      DATABASE_URL: "mysql://tijanes_user:tijanes_pass@mysql:3306/tijanes_db?serverVersion=8.0"
      APP_ENV: dev
      APP_SECRET: "c6a782b14e9f5923984d718a2049b1a5"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    networks:
      - tijanes_net

  mysql:
    image: mysql:8.0
    container_name: tijanes_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootsecretpass
      MYSQL_DATABASE: tijanes_db
      MYSQL_USER: tijanes_user
      MYSQL_PASSWORD: tijanes_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tijanes_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tijanes_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    networks:
      - tijanes_net

  mailhog:
    image: mailhog/mailhog
    container_name: tijanes_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tijanes_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tijanes_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tijanes_net

volumes:
  db_data:

networks:
  tijanes_net:
    driver: bridge

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\IdentityAccess\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/v1/auth/login
            stateless: true
            json_login:
                check_path: /api/v1/auth/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    role_hierarchy:
        ROLE_STUDENT: ROLE_USER
        ROLE_PARENT: ROLE_USER
        ROLE_TEACHER: ROLE_USER
        ROLE_PAYMENT_AGENT: ROLE_USER
        ROLE_ADMIN: [ROLE_TEACHER, ROLE_PAYMENT_AGENT]

    access_control:
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
        - { path: ^/api/v1/payment-agent, roles: ROLE_PAYMENT_AGENT }
        - { path: ^/api/v1/teacher, roles: ROLE_TEACHER }
        - { path: ^/api/v1/parent, roles: ROLE_PARENT }
        - { path: ^/api/v1/student, roles: ROLE_STUDENT }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
